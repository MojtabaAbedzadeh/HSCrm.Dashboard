name: .NET 8 CI

on:
  push:
    branches:
      - master
      - fix/frontend-audit
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: dotnet-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore HSCrm.Dashboard.sln

      - name: Build
        run: dotnet build HSCrm.Dashboard.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test HSCrm.Dashboard.sln --configuration Release --no-build --verbosity normal
