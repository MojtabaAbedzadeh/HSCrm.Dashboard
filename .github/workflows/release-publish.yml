name: .NET 8 Dashboard release package

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-package-dashboard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore HSCrm.Dashboard.sln

      - name: Build
        run: dotnet build HSCrm.Dashboard.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test HSCrm.Dashboard.sln --configuration Release --no-build --verbosity normal

      - name: Publish Dashboard for IIS
        run: dotnet publish HSCrm.Dashboard/HSCrm.Dashboard.csproj --configuration Release --no-restore --output "${{ runner.temp }}\publish\dashboard"

      - name: Include deployment metadata
        shell: pwsh
        run: |
          @(
            "component=dashboard"
            "targetFramework=net8.0"
            "version=${{ github.ref_name }}"
            "commit=${{ github.sha }}"
            "builtAtUtc=$([DateTime]::UtcNow.ToString('o'))"
          ) | Set-Content -Path "${{ runner.temp }}\publish\dashboard\release-info.txt" -Encoding utf8

      - name: Upload IIS package
        uses: actions/upload-artifact@v4
        with:
          name: hscrm-dashboard-${{ github.ref_name }}
          path: ${{ runner.temp }}\publish\dashboard\
          if-no-files-found: error
          retention-days: 30

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hscrm-dashboard-test-results-${{ github.run_id }}
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore
          retention-days: 14
